<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WynnPages — Live Custom Website Demo Preview</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link href="/assets/fonts.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #1c1917;
    }
    .font-editorial {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }
    #claim-btn {
      position: relative;
      overflow: hidden;
      animation: claim-glow 3.8s ease-in-out infinite;
    }
    #claim-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -130%;
      width: 70%;
      height: 200%;
      background: linear-gradient(110deg, transparent 20%, rgba(255, 255, 255, 0.22) 45%, rgba(255, 255, 255, 0.42) 50%, rgba(255, 255, 255, 0.22) 55%, transparent 80%);
      transform: skewX(-20deg);
      pointer-events: none;
      animation: claim-sheen 4.8s ease-in-out infinite;
    }
    #claim-btn:hover .claim-arrow {
      transform: translateX(3px);
    }
    .claim-arrow {
      transition: transform 0.2s ease;
      display: inline-block;
    }
    @keyframes claim-sheen {
      0%, 65% { left: -130%; opacity: 0; }
      70% { opacity: 1; }
      85% { left: 160%; opacity: 0.9; }
      90%, 100% { left: 160%; opacity: 0; }
    }
    @keyframes claim-glow {
      0%, 100% {
        box-shadow: 0 10px 24px rgba(150, 67, 43, 0.45);
        border-color: rgba(251, 222, 185, 0.28);
      }
      50% {
        box-shadow: 0 12px 28px rgba(150, 67, 43, 0.65), 0 0 18px rgba(232, 185, 72, 0.35);
        border-color: rgba(232, 185, 72, 0.6);
      }
    }
  </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden">

  <!-- Full-Screen Demo Iframe -->
  <iframe 
    id="demo-iframe" 
    src="about:blank" 
    class="w-full flex-1 border-0 bg-white"
    title="Custom Website Demo Preview"
  ></iframe>

  <!-- Floating Bottom Claim Bar (Phase 2: The Hook) -->
  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 w-[calc(100%-24px)] max-w-3xl bg-[#1c1917]/96 backdrop-blur-xl text-[#fcf9f3] border border-[#e5dec9]/25 rounded-2xl p-3 sm:px-5 sm:py-3.5 shadow-2xl flex flex-col sm:flex-row items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0 w-full sm:w-auto">
      <a href="https://wynnpages.com.au" target="_blank" rel="noopener" class="w-11 h-11 rounded-xl bg-[#96432b] p-1 flex items-center justify-center shrink-0 shadow-sm border border-[#e8b948]/45 transition-all hover:scale-105 overflow-hidden" title="Visit WynnPages Studio (wynnpages.com.au)">
        <img src="https://wynnpages.com.au/assets/favicon-light.png" alt="WynnPages Atelier" class="w-full h-full object-contain">
      </a>
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-1.5 flex-nowrap">
          <a href="https://wynnpages.com.au" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-[10px] uppercase tracking-wider font-extrabold text-[#e8b948] bg-[#e8b948]/15 hover:bg-[#e8b948]/25 border border-[#e8b948]/30 px-2 py-0.5 rounded-md transition-all shrink-0">
            <span>wynnpages.com.au</span>
            <svg class="w-2.5 h-2.5" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.5 8.5L8.5 3.5M8.5 3.5H4.5M8.5 3.5V7.5"/>
            </svg>
          </a>
          <span class="hidden sm:inline text-stone-500 text-[9px]">•</span>
          <span class="hidden sm:inline text-[10px] uppercase tracking-widest text-[#fbdeb9]/80 font-bold truncate">
            Bespoke Demo • No Monthly Fees
          </span>
        </div>
        <div id="preview-biz-name" class="flex items-baseline gap-1.5 truncate mt-0.5">
          <span class="text-[11px] font-semibold text-stone-400 uppercase tracking-wider shrink-0">Crafted exclusively for</span>
          <strong id="preview-biz-highlight" class="text-sm sm:text-base font-extrabold text-white truncate">Your Business</strong>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-2 w-full sm:w-auto justify-end shrink-0">
      <a 
        href="https://wynnpages.com.au" 
        target="_blank" 
        rel="noopener"
        class="hidden sm:inline-flex items-center gap-1.5 px-3.5 py-3 rounded-xl bg-white/5 hover:bg-white/10 border border-[#e5dec9]/20 text-[#f6f1e8] text-xs font-semibold transition-all hover:border-[#e8b948]/50"
        title="Visit WynnPages Studio"
      >
        <span>About Studio</span>
        <svg class="w-3 h-3" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 8.5L8.5 3.5M8.5 3.5H4.5M8.5 3.5V7.5"/>
        </svg>
      </a>
      <a 
        id="claim-btn" 
        href="/api/claim"
        class="w-full sm:w-auto text-center px-5 py-3 rounded-xl bg-[#96432b] hover:bg-[#7d3520] active:scale-[0.99] text-white font-bold text-xs sm:text-sm shadow-lg shadow-[#96432b]/40 transition-all inline-flex items-center justify-center gap-2 whitespace-nowrap"
      >
        <span id="claim-btn-label">Claim This Website — $599 AUD</span>
        <span class="claim-arrow">&rarr;</span>
      </a>
    </div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const cid = (params.get('cid') || '').trim();
      const demoParam = (params.get('demo') || params.get('url') || '').trim();
      const emailParam = (params.get('email') || '').trim();
      const nameParam = (params.get('name') || '').trim();

      const iframe = document.getElementById('demo-iframe');
      const bizNameEl = document.getElementById('preview-biz-name');
      const claimBtn = document.getElementById('claim-btn');
      const claimLabel = document.getElementById('claim-btn-label');

      function applyInfo({ demoUrl, name, email, id }) {
        if (name) {
          const highlightEl = document.getElementById('preview-biz-highlight');
          if (highlightEl) highlightEl.textContent = name;
          else bizNameEl.textContent = 'Crafted exclusively for ' + name;
          document.title = `${name} — Custom Website Demo | WynnPages`;
        }
        if (demoUrl) {
          const fullUrl = demoUrl.startsWith('http') ? demoUrl : 'https://' + demoUrl;
          iframe.src = fullUrl;
        }
        const q = new URLSearchParams();
        if (id || cid) q.set('cid', id || cid);
        if (email || emailParam) q.set('email', email || emailParam);
        if (name || nameParam) q.set('name', name || nameParam);
        if (demoUrl || demoParam) q.set('demo', demoUrl || demoParam);
        claimBtn.href = `/api/claim?${q.toString()}`;
      }

      claimBtn.addEventListener('click', () => {
        claimLabel.textContent = 'Redirecting to Secure Stripe Checkout...';
      });

      if (demoParam) {
        applyInfo({ demoUrl: demoParam, name: nameParam, email: emailParam, id: cid });
      } else if (cid) {
        fetch(`/api/client-public?cid=${encodeURIComponent(cid)}`)
          .then(r => r.json())
          .then(data => {
            if (data && data.ok) {
              applyInfo({
                demoUrl: data.demoUrl || '/',
                name: data.businessName || data.name,
                email: data.email,
                id: data.id
              });
            }
          })
          .catch(() => {});
      }
    })();
  </script>
</body>
</html>
