<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" width="360" height="110" fill="none">
  <defs>
    <!-- 24K Champagne Gold & Antique Brass Metallic Gradient -->
    <linearGradient id="atelierGoldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C5A1C"/>
      <stop offset="22%" stop-color="#D49B28"/>
      <stop offset="45%" stop-color="#F7E3A8"/>
      <stop offset="68%" stop-color="#B87D1E"/>
      <stop offset="88%" stop-color="#E5B952"/>
      <stop offset="100%" stop-color="#7A4B12"/>
    </linearGradient>
    <linearGradient id="atelierDarkInk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B2316"/>
      <stop offset="50%" stop-color="#5A3622"/>
      <stop offset="100%" stop-color="#2B1910"/>
    </linearGradient>
    <filter id="plasterRelief" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="-0.6" dy="-0.6" stdDeviation="0.4" flood-color="#FFFDF8" flood-opacity="0.65"/>
      <feDropShadow dx="1.1" dy="1.8" stdDeviation="1.1" flood-color="#2B1B10" flood-opacity="0.24"/>
    </filter>
  </defs>

  <g filter="url(#plasterRelief)">
    <!-- Top Haute Couture Botanical & Starburst Crest -->
    <g transform="translate(180, 18)">
      <!-- Left & Right Delicate Olive Leaf Sprigs -->
      <path d="M-34 4 C-24 4, -16 1, -8 -1" stroke="url(#atelierGoldFoil)" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M-24 3 C-21 -1, -16 -2, -14 1 C-17 3, -21 4, -24 3 Z" fill="url(#atelierGoldFoil)" opacity="0.85"/>
      <path d="M34 4 C24 4, 16 1, 8 -1" stroke="url(#atelierGoldFoil)" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M24 3 C21 -1, 16 -2, 14 1 C17 3, 21 4, 24 3 Z" fill="url(#atelierGoldFoil)" opacity="0.85"/>
      <!-- Center 4-Point Atelier Diamond Star -->
      <path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2 Z" fill="url(#atelierGoldFoil)"/>
      <circle cx="-13" cy="0" r="1.2" fill="url(#atelierGoldFoil)"/>
      <circle cx="13" cy="0" r="1.2" fill="url(#atelierGoldFoil)"/>
    </g>

    <!-- Main Engraved Editorial Wordmark: LUX NAILS BAR -->
    <text
      x="180"
      y="64"
      text-anchor="middle"
      font-family="'Cormorant Garamond', 'Didot', 'Bodoni MT', Georgia, serif"
      font-size="42"
      font-weight="600"
      font-style="italic"
      letter-spacing="5"
      fill="url(#atelierDarkInk)"
    >Lux Nails</text>

    <!-- Subtle Gold-Leaf Hairline Rule with Center Diamond -->
    <line x1="88" y1="78" x2="171" y2="78" stroke="url(#atelierGoldFoil)" stroke-width="0.9" opacity="0.8"/>
    <polygon points="180,75 183,78 180,81 177,78" fill="url(#atelierGoldFoil)"/>
    <line x1="189" y1="78" x2="272" y2="78" stroke="url(#atelierGoldFoil)" stroke-width="0.9" opacity="0.8"/>

    <!-- Architectural Sub-Caption -->
    <text
      x="180"
      y="96"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif"
      font-size="9.5"
      font-weight="600"
      letter-spacing="4.5"
      fill="#6B442A"
    >ATELIER &amp; SANCTUARY</text>
  </g>
</svg>

