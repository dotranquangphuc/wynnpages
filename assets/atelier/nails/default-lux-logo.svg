<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 1 360 150" width="720" height="300" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" fill="none">
  <defs>
    <!-- 24K Gold-Leaf Foil Multi-Stop Metallic Gradient -->
    <linearGradient id="goldLeafBody" x1="6%" y1="4%" x2="94%" y2="96%">
      <stop offset="0%" stop-color="#9E6812"/>
      <stop offset="15%" stop-color="#E7BA4C"/>
      <stop offset="30%" stop-color="#FFF2C4"/>
      <stop offset="46%" stop-color="#D49B28"/>
      <stop offset="62%" stop-color="#9B6510"/>
      <stop offset="78%" stop-color="#F7DC88"/>
      <stop offset="91%" stop-color="#C88A1E"/>
      <stop offset="100%" stop-color="#8C580A"/>
    </linearGradient>

    <!-- Brushed Gold Specular Bevel Highlight -->
    <linearGradient id="goldLeafSheen" x1="0%" y1="0%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#FFFDF5" stop-opacity="0.82"/>
      <stop offset="38%" stop-color="#FBE8A4" stop-opacity="0.52"/>
      <stop offset="70%" stop-color="#D49B28" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFF9E2" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Deep Antique Bronze 3D Extrusion -->
    <linearGradient id="goldBronzeDepth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C3A08"/>
      <stop offset="55%" stop-color="#744A0C"/>
      <stop offset="100%" stop-color="#4A2E05"/>
    </linearGradient>
  </defs>

  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- LAYER 0: Pure-Vector Ambient Drop Shadow (Safari/iOS Retina Crisp, Zero Bitmap Filter) -->
    <g transform="translate(-2.0, 3.5)" stroke="#2B1E0D" stroke-opacity="0.16">
      <path d="M 105 16 C 81 33, 76 60, 96 71 C 117 82, 149 70, 173 48 C 192 31, 201 14, 193 9 C 184 4, 159 20, 141 48 C 119 82, 95 113, 66 132 C 47 145, 20 145, 18 133 C 17 121, 40 120, 60 129 C 85 140, 114 142, 140 133 C 150 129, 157 124, 162 119" stroke-width="11.4"/>
      <path d="M 183 108 C 176 123, 174 137, 182 138 C 190 139, 199 124, 205 109 C 201 124, 203 139, 217 139 C 232 139, 245 123, 254 103" stroke-width="10.6"/>
      <path d="M 254 103 C 267 121, 286 139, 310 139 C 331 139, 347 125, 359 104" stroke-width="10.6"/>
      <path d="M 248 136 C 259 125, 270 114, 281 105" stroke-width="9.8"/>
    </g>

    <!-- LAYER 1: 3D Extruded Antique Bronze Backing -->
    <g transform="translate(-1.2, 2.0)" stroke="url(#goldBronzeDepth)">
      <!-- L -->
      <path d="M 105 16 C 81 33, 76 60, 96 71 C 117 82, 149 70, 173 48 C 192 31, 201 14, 193 9 C 184 4, 159 20, 141 48 C 119 82, 95 113, 66 132 C 47 145, 20 145, 18 133 C 17 121, 40 120, 60 129 C 85 140, 114 142, 140 133 C 150 129, 157 124, 162 119" stroke-width="10.4"/>
      <!-- u flowing cleanly to x shoulder -->
      <path d="M 183 108 C 176 123, 174 137, 182 138 C 190 139, 199 124, 205 109 C 201 124, 203 139, 217 139 C 232 139, 245 123, 254 103" stroke-width="9.6"/>
      <!-- x main wave -->
      <path d="M 254 103 C 267 121, 286 139, 310 139 C 331 139, 347 125, 359 104" stroke-width="9.6"/>
      <!-- x cross stroke -->
      <path d="M 248 136 C 259 125, 270 114, 281 105" stroke-width="8.8"/>
    </g>

    <!-- LAYER 2: 24K Gold-Leaf Foil Body -->
    <g stroke="url(#goldLeafBody)">
      <!-- L -->
      <path d="M 105 16 C 81 33, 76 60, 96 71 C 117 82, 149 70, 173 48 C 192 31, 201 14, 193 9 C 184 4, 159 20, 141 48 C 119 82, 95 113, 66 132 C 47 145, 20 145, 18 133 C 17 121, 40 120, 60 129 C 85 140, 114 142, 140 133 C 150 129, 157 124, 162 119" stroke-width="9.4"/>
      <!-- u flowing cleanly to x shoulder -->
      <path d="M 183 108 C 176 123, 174 137, 182 138 C 190 139, 199 124, 205 109 C 201 124, 203 139, 217 139 C 232 139, 245 123, 254 103" stroke-width="8.6"/>
      <!-- x main wave -->
      <path d="M 254 103 C 267 121, 286 139, 310 139 C 331 139, 347 125, 359 104" stroke-width="8.6"/>
      <!-- x cross stroke -->
      <path d="M 248 136 C 259 125, 270 114, 281 105" stroke-width="7.8"/>
    </g>

    <!-- LAYER 3: Specular Gold-Leaf Foil Highlight Ridge -->
    <g transform="translate(0.3, -0.7)" stroke="url(#goldLeafSheen)">
      <!-- L -->
      <path d="M 105 16 C 81 33, 76 60, 96 71 C 117 82, 149 70, 173 48 C 192 31, 201 14, 193 9 C 184 4, 159 20, 141 48 C 119 82, 95 113, 66 132 C 47 145, 20 145, 18 133 C 17 121, 40 120, 60 129 C 85 140, 114 142, 140 133 C 150 129, 157 124, 162 119" stroke-width="2.0"/>
      <!-- u + x unified bevel highlight -->
      <path d="M 183 108 C 176 123, 174 137, 182 138 C 190 139, 199 124, 205 109 C 201 124, 203 139, 217 139 C 232 139, 245 123, 254 103 C 267 121, 286 139, 310 139 C 331 139, 347 125, 359 104" stroke-width="1.8"/>
      <path d="M 248 136 C 259 125, 270 114, 281 105" stroke-width="1.5"/>
    </g>
  </g>
</svg>
