<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100">
  <defs>
    <linearGradient id="luxGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED596"/>
      <stop offset="30%" stop-color="#C8963E"/>
      <stop offset="65%" stop-color="#965E16"/>
      <stop offset="100%" stop-color="#BD892F"/>
    </linearGradient>
    <linearGradient id="luxLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EED596" stop-opacity="0.6"/>
      <stop offset="15%" stop-color="#C8963E"/>
      <stop offset="50%" stop-color="#965E16"/>
      <stop offset="85%" stop-color="#C8963E"/>
      <stop offset="100%" stop-color="#EED596" stop-opacity="0.6"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Parisienne&amp;family=Plus+Jakarta+Sans:wght@600&amp;display=swap');
      .lux-cursive {
        font-family: 'Parisienne', 'Great Vibes', cursive;
        font-size: 64px;
        fill: url(#luxGold);
      }
      .lux-sub {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.32em;
        fill: #965E16;
      }
    </style>
  </defs>
  <!-- Main Script 'Lux' -->
  <text x="120" y="56" text-anchor="middle" class="lux-cursive">Lux</text>
  <!-- Thin Hairline Divider -->
  <line x1="24" y1="68" x2="216" y2="68" stroke="url(#luxLine)" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Subtitle 'NAIL BAR & CO.' -->
  <text x="123" y="86" text-anchor="middle" class="lux-sub">NAIL BAR &amp; CO.</text>
</svg>