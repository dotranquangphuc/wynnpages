<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Commercial Contractor | Tradie Master Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-b2b">
    <div class="global-noise"></div>
    <header class="header glass-panel">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon"><i class="ph-bold ph-buildings"></i></span>
                <span class="logo-text">APEX COMM-TILING</span>
            </div>
            <nav class="nav-links">
                <a href="#capabilities">Capabilities</a>
                <a href="#compliance">Compliance</a>
            </nav>
            <div class="nav-cta">
                <a href="mailto:tenders@apex.com" class="btn btn-primary magnetic" data-strength="20">
                    <span class="btn-text">Submit BOQ</span>
                </a>
            </div>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="hero-glow"></div>
            <div class="container hero-layout">
                <div class="hero-content">
                    <div class="hero-badge reveal">
                        <span class="badge-dot green"></span> Tier-1 Subcontractor
                    </div>
                    <h1 class="hero-title reveal delay-1">
                        Precision at <span class="text-accent">Scale.</span>
                    </h1>
                    <div class="hero-specs-grid reveal delay-2">
                        <div class="spec-item"><i class="ph-fill ph-check-circle"></i> AS 3958.1 Compliant</div>
                        <div class="spec-item"><i class="ph-fill ph-check-circle"></i> QBCC 15242278</div>
                    </div>
                    <p class="hero-desc reveal delay-3 mt-4">
                        Trusted by top-tier builders across Queensland.
                    </p>
                    <div class="hero-actions reveal delay-4">
                        <a href="#tender" class="btn btn-primary btn-lg magnetic" data-strength="30">
                            <span class="btn-text">Discuss Project</span>
                        </a>
                    </div>
                </div>
                <div class="hero-visual reveal delay-2">
                    <div class="visual-card interactive-card glass-panel tech-hud">
                        <div class="hud-header">
                            <span class="hud-title">LASER CALIBRATION</span>
                            <span class="hud-status text-accent">ACTIVE</span>
                        </div>
                        <div class="hud-leveler">
                            <div class="level-line left"></div>
                            <div class="level-bubble"></div>
                            <div class="level-line right"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
