<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Custom Builder | Tradie Master Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-builder">
    <div class="global-noise"></div>
    <header class="header glass-panel">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-text font-light tracking-wide">AURA ARCHITECTURE</span>
            </div>
            <nav class="nav-links">
                <a href="#portfolio">Portfolio</a>
                <a href="#process">Our Process</a>
                <a href="#journal">Journal</a>
            </nav>
            <div class="nav-cta">
                <a href="#consultation" class="btn btn-outline magnetic" data-strength="20">
                    <span class="btn-text">Book Consultation</span>
                </a>
            </div>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="hero-glow"></div>
            <div class="container hero-layout layout-centered">
                <div class="hero-content text-center">
                    <div class="hero-badge reveal">Award-Winning Custom Homes</div>
                    <h1 class="hero-title reveal delay-1">
                        Crafting Timeless <span class="text-accent text-italic">Sanctuaries.</span>
                    </h1>
                    <p class="hero-desc reveal delay-2 mx-auto">
                        We build more than houses; we craft bespoke living experiences tailored to your family's legacy. Experience uncompromising luxury.
                    </p>
                    <div class="hero-actions justify-center reveal delay-3">
                        <a href="#portfolio" class="btn btn-primary btn-lg magnetic" data-strength="30">
                            <span class="btn-text">Explore The Collection</span>
                        </a>
                    </div>
                </div>
            </div>
        </section>
        <section class="portfolio-showcase reveal">
            <div class="container">
                <div class="visual-card interactive-card glass-panel p-0">
                    <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?ixlib=rb-4.0.3&auto=format&fit=crop&w=1600&q=80" alt="Luxury Home" class="visual-img w-full h-800">
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
