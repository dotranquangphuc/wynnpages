<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Plumber | Tradie Master Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-plumber">
    <div class="global-noise"></div>
    <header class="header glass-panel">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon"><i class="ph-bold ph-drop"></i></span>
                <span class="logo-text">RAPID PLUMBING</span>
            </div>
            <div class="nav-cta">
                <a href="tel:1300999999" class="btn btn-emergency magnetic" data-strength="20">
                    <span class="btn-text">
                        <i class="ph-fill ph-phone-call"></i> 1300 999 999
                    </span>
                </a>
            </div>
        </div>
    </header>
    <a href="tel:1300999999" class="mobile-sticky-call">
        <i class="ph-fill ph-phone-call"></i> CALL NOW - 24/7
    </a>
    <main>
        <section class="hero hero-emergency">
            <div class="container hero-layout">
                <div class="hero-content">
                    <div class="hero-badge badge-emergency reveal">
                        <span class="pulse-beacon red"></span> 24/7 Emergency Dispatch
                    </div>
                    <h1 class="hero-title reveal delay-1">
                        Burst Pipe? Blocked Drain?<br>
                        <span class="text-accent">We Arrive in 30 Mins.</span>
                    </h1>
                    <p class="hero-desc reveal delay-2">
                        Don't let water damage your property. Our fully licensed local plumbers are on standby right now. Fixed pricing, no hidden fees.
                    </p>
                    <div class="hero-actions reveal delay-3">
                        <a href="tel:1300999999" class="btn btn-emergency btn-lg magnetic" data-strength="30">
                            <span class="btn-text">Dispatch Plumber Now</span>
                        </a>
                    </div>
                </div>
                <div class="hero-visual reveal delay-2">
                    <div class="visual-card interactive-card">
                        <img src="https://images.unsplash.com/photo-1607472586893-edb57cbceb42?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Plumber at work" class="visual-img">
                        <div class="floating-badge bottom-left emergency-badge">
                            <i class="ph-fill ph-clock-countdown"></i> Arriving fast!
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
